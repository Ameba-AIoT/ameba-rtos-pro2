[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ameba-dev-mcp-pro2"
version = "1.0.0"
description = "FastMCP server for AmebaPro2 SoC development"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0,<4.0",
    "pyserial",
    "pydantic>=2.0",
    "pyjson5",
    "json5",
]

[project.scripts]
ameba-mcp = "ameba_dev_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ameba_dev_mcp*"]
